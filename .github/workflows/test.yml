name: Test

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a breaking SDK, LangChain or langchain-cerebrus-pulse release
    # is caught even when nothing in this repo changes.
    - cron: "41 6 * * 1"
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Runs every example against a mocked API: no network, no wallet, no cost.
    name: examples (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r tests/requirements.txt
      - name: Test
        run: python -m pytest -q
